services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PALAWA_DB_PASSWORD: ${PALAWA_DB_PASSWORD:?set PALAWA_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://palawa:${PALAWA_DB_PASSWORD:?set PALAWA_DB_PASSWORD}@postgres:5432/palawa
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  tasks:
    build:
      context: .
      target: tasks
    environment:
      DATABASE_URL: postgresql://palawa:${PALAWA_DB_PASSWORD:?set PALAWA_DB_PASSWORD}@postgres:5432/palawa
      PALAWA_ORGANIZATION_ID: ${PALAWA_ORGANIZATION_ID:?set PALAWA_ORGANIZATION_ID}
      PALAWA_OWNER_WHATSAPP_NUMBER: ${PALAWA_OWNER_WHATSAPP_NUMBER:?set PALAWA_OWNER_WHATSAPP_NUMBER}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET}
      N8N_WHATSAPP_OUTBOUND_URL: http://n8n:5678/webhook/palawa/whatsapp/outbound
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      APP_URL: ${APP_URL:?set APP_URL}
      API_URL: ${API_URL:?set API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      DATABASE_URL: postgresql://palawa:${PALAWA_DB_PASSWORD:?set PALAWA_DB_PASSWORD}@postgres:5432/palawa
      PALAWA_ORGANIZATION_ID: ${PALAWA_ORGANIZATION_ID:?set PALAWA_ORGANIZATION_ID}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET}
      WAHA_BASE_URL: http://waha:3000
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?set AI_GATEWAY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tasks:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        APP_URL: ${APP_URL:?set APP_URL}
        API_URL: ${API_URL:?set API_URL}
        NUXT_PUBLIC_SITE_URL: ${APP_URL:?set APP_URL}
        NUXT_PUBLIC_API_URL: ${API_URL:?set API_URL}
    environment:
      NUXT_PUBLIC_SITE_URL: ${APP_URL:?set APP_URL}
      NUXT_PUBLIC_API_URL: ${API_URL:?set API_URL}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.41.1
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: n8n
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678/}
      WEBHOOK_URL: http://n8n:5678/
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  waha:
    image: devlikeapro/waha:latest-2026.8.2
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?set WAHA_API_KEY}
      WAHA_BASE_URL: http://waha:3000
    ports:
      - "127.0.0.1:${WAHA_HOST_PORT:-3000}:3000"
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    profiles: [public-edge]
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres:
  n8n_data:
  waha_sessions:
  caddy_data:
  caddy_config:
